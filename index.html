<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunflower Land - Resource Price Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 p-2.5 rounded-xl text-white shadow-lg shadow-emerald-900/30">
                    <i class="fa-solid fa-seedling text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                        SFL Price Tracker
                        <span class="inline-flex items-center gap-1 text-[10px] bg-emerald-950 text-emerald-400 font-mono px-2 py-0.5 rounded border border-emerald-800">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> LIVE
                        </span>
                    </h1>
                    <p class="text-xs text-slate-400" id="lastUpdatedLabel">Fetching market data...</p>
                </div>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl text-xs text-slate-400">
                    <input type="checkbox" id="autoRefreshCheck" checked class="accent-emerald-500 cursor-pointer">
                    <label for="autoRefreshCheck" class="cursor-pointer select-none">Live Auto-Sync (15s)</label>
                </div>
                <button id="refreshBtn" onclick="fetchPrices()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 justify-center shadow-md">
                    <i class="fa-solid fa-rotate" id="refreshIcon"></i> Refresh
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Controls Bar -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center shadow-sm">
            
            <!-- Search -->
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterAndSortData()" placeholder="Search item (e.g. Sunflower, Wood, Iron, Egg)..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-100 placeholder-slate-500 transition">
            </div>

            <!-- Market Selector & Sorting -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                <div class="flex items-center gap-2">
                    <label for="marketType" class="text-xs text-slate-400 uppercase font-semibold">Market:</label>
                    <select id="marketType" onchange="filterAndSortData()" class="bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-emerald-500">
                        <option value="p2p">Plaza (P2P)</option>
                        <option value="seq">Sequence (Seq)</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label for="sortSelect" class="text-xs text-slate-400 uppercase font-semibold">Sort:</label>
                    <select id="sortSelect" onchange="filterAndSortData()" class="bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-emerald-500">
                        <option value="name-asc">Name (A - Z)</option>
                        <option value="name-desc">Name (Z - A)</option>
                        <option value="price-desc">Price (High to Low)</option>
                        <option value="price-asc">Price (Low to High)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-24">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-500 mb-4"></i>
            <p class="text-slate-400 text-sm">Extracting live prices...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden bg-rose-950/40 border border-rose-800/80 text-rose-200 p-5 rounded-2xl text-center my-8">
            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 text-rose-400"></i>
            <p id="errorMessage" class="font-medium">Failed to fetch pricing data.</p>
        </div>

        <!-- Prices Grid -->
        <div id="priceGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 hidden">
            <!-- Rendered cards -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 text-center py-6 text-xs text-slate-500">
        <p>Market floor data from <a href="https://sfl.world" target="_blank" class="text-emerald-400 hover:underline">sfl.world</a></p>
    </footer>

    <script>
        let rawData = [];
        let autoRefreshTimer = null;

        // Universal parser to extract numeric price from whatever shape the API supplies
        function extractPriceNumber(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return val;
            if (typeof val === 'string') {
                const parsed = parseFloat(val);
                return isNaN(parsed) ? 0 : parsed;
            }
            if (typeof val === 'object') {
                // If nested object has price, sfl, floor, val, or amount
                if (val.price !== undefined) return extractPriceNumber(val.price);
                if (val.sfl !== undefined) return extractPriceNumber(val.sfl);
                if (val.floor !== undefined) return extractPriceNumber(val.floor);
                if (val.value !== undefined) return extractPriceNumber(val.value);
                // Check first object value
                const firstVal = Object.values(val)[0];
                if (typeof firstVal === 'number' || typeof firstVal === 'string') {
                    return extractPriceNumber(firstVal);
                }
            }
            return 0;
        }

        async function fetchPrices() {
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const priceGrid = document.getElementById('priceGrid');
            const refreshIcon = document.getElementById('refreshIcon');
            const lastUpdatedLabel = document.getElementById('lastUpdatedLabel');

            if (rawData.length === 0) {
                loadingState.classList.remove('hidden');
                priceGrid.classList.add('hidden');
            }
            errorState.classList.add('hidden');
            refreshIcon.classList.add('fa-spin');

            const endpoints = [
                '/api/prices',
                'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://sfl.world/api/v1/prices'),
                'https://sfl.world/api/v1/prices'
            ];

            let result = null;
            for (const url of endpoints) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        result = await res.json();
                        break;
                    }
                } catch (e) {
                    // Try next fallback
                }
            }

            refreshIcon.classList.remove('fa-spin');

            if (!result) {
                if (rawData.length === 0) {
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                    document.getElementById('errorMessage').innerText = "Unable to reach SFL API. Check your proxy route.";
                }
                return;
            }

            try {
                // Update time display
                if (result.updatedAt || result.updated_text) {
                    const t = result.updatedAt ? new Date(result.updatedAt).toLocaleTimeString() : result.updated_text;
                    lastUpdatedLabel.innerText = `Last API sync: ${t}`;
                } else {
                    lastUpdatedLabel.innerText = `Live at ${new Date().toLocaleTimeString()}`;
                }

                // Metadata keys to ignore
                const ignoredKeys = new Set(['updatedAt', 'updated_text', 'data', 'status', 'success', 'timestamp']);

                // Find the dictionary of items (either at top-level or inside result.data)
                let itemsMap = {};
                if (result.data && typeof result.data === 'object' && !Array.isArray(result.data)) {
                    itemsMap = result.data;
                } else if (typeof result === 'object' && !Array.isArray(result)) {
                    itemsMap = result;
                }

                const parsedList = [];

                if (Array.isArray(result)) {
                    result.forEach(item => {
                        const name = item.name || item.resource || item.item;
                        if (name) {
                            parsedList.push({
                                name: name,
                                p2p: extractPriceNumber(item.p2p ?? item.price ?? item.sfl),
                                seq: extractPriceNumber(item.seq)
                            });
                        }
                    });
                } else {
                    for (const [key, value] of Object.entries(itemsMap)) {
                        if (ignoredKeys.has(key)) continue;
                        
                        let p2pPrice = 0;
                        let seqPrice = 0;

                        if (typeof value === 'object' && value !== null) {
                            if (value.p2p !== undefined) p2pPrice = extractPriceNumber(value.p2p);
                            if (value.seq !== undefined) seqPrice = extractPriceNumber(value.seq);
                            
                            // If neither p2p nor seq is explicitly named, try price/sfl
                            if (p2pPrice === 0 && seqPrice === 0) {
                                p2pPrice = extractPriceNumber(value);
                            }
                        } else {
                            p2pPrice = extractPriceNumber(value);
                        }

                        // Only add items that represent actual game resources
                        if (key.length > 1) {
                            parsedList.push({
                                name: key,
                                p2p: p2pPrice,
                                seq: seqPrice
                            });
                        }
                    }
                }

                rawData = parsedList;
                filterAndSortData();
                loadingState.classList.add('hidden');
                priceGrid.classList.remove('hidden');
            } catch (err) {
                console.error("Format parsing error:", err);
            }
        }

        function filterAndSortData() {
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const sortOption = document.getElementById('sortSelect').value;
            const marketType = document.getElementById('marketType').value;

            let filtered = rawData.filter(item => item.name.toLowerCase().includes(searchKeyword));

            filtered.sort((a, b) => {
                const nameA = a.name.toLowerCase();
                const nameB = b.name.toLowerCase();
                const priceA = a[marketType] || 0;
                const priceB = b[marketType] || 0;

                if (sortOption === 'name-asc') return nameA.localeCompare(nameB);
                if (sortOption === 'name-desc') return nameB.localeCompare(nameA);
                if (sortOption === 'price-desc') return priceB - priceA;
                if (sortOption === 'price-asc') return priceA - priceB;
                return 0;
            });

            renderGrid(filtered, marketType);
        }

        function formatDisplayPrice(price) {
            if (!price || price === 0) return "-";
            if (price < 0.001) return price.toFixed(6);
            if (price < 1) return price.toFixed(4);
            return price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
        }

        function renderGrid(data, marketType) {
            const priceGrid = document.getElementById('priceGrid');
            priceGrid.innerHTML = '';

            if (data.length === 0) {
                priceGrid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-500">
                        <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                        <p class="text-sm">No items found matching your search.</p>
                    </div>
                `;
                return;
            }

            data.forEach(item => {
                const activePrice = item[marketType];
                const secondaryPrice = marketType === 'p2p' ? item.seq : item.p2p;
                const secondaryLabel = marketType === 'p2p' ? 'Seq' : 'P2P';

                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-emerald-500/40 transition shadow-sm";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <h3 class="font-semibold text-slate-100 text-sm truncate" title="${item.name}">${item.name}</h3>
                            <span class="bg-emerald-950 text-emerald-400 text-[10px] font-medium px-2 py-0.5 rounded border border-emerald-800/50 uppercase">
                                ${marketType}
                            </span>
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-800">
                        <div class="flex items-baseline justify-between">
                            <span class="text-[11px] text-slate-500 uppercase font-semibold">Floor</span>
                            <div class="text-right">
                                <span class="text-lg font-bold font-mono ${activePrice > 0 ? 'text-emerald-400' : 'text-slate-600'}">
                                    ${formatDisplayPrice(activePrice)}
                                </span>
                                <span class="text-[11px] text-slate-400 ml-0.5">SFL</span>
                            </div>
                        </div>
                        ${secondaryPrice > 0 ? `
                        <div class="flex items-center justify-between text-[11px] text-slate-400 mt-2 pt-2 border-t border-slate-800/50">
                            <span>${secondaryLabel} Floor:</span>
                            <span class="font-mono text-slate-300">${formatDisplayPrice(secondaryPrice)} SFL</span>
                        </div>` : ''}
                    </div>
                `;
                priceGrid.appendChild(card);
            });
        }

        // Live Auto-Refresh every 15s
        function setupAutoRefresh() {
            const check = document.getElementById('autoRefreshCheck');
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);

            if (check.checked) {
                autoRefreshTimer = setInterval(() => {
                    fetchPrices();
                }, 15000);
            }

            check.addEventListener('change', () => {
                setupAutoRefresh();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPrices();
            setupAutoRefresh();
        });
    </script>
</body>
</html>
