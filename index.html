<!-- Price Trend Graph Section -->
<div class="mt-6 sm:mt-8 pt-4 sm:pt-6 border-t border-stone-200/80 dark:border-slate-800">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5 mb-3.5">
        <div>
            <div class="flex items-center gap-2">
                <h4 class="text-xs font-bold text-stone-700 dark:text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-line text-amber-500"></i> Price History
                </h4>
                <!-- SFL Season Badge -->
                <span id="currentSeasonBadge" class="inline-flex items-center gap-1 text-[10px] sm:text-xs font-bold px-2 sm:px-2.5 py-0.5 rounded-full border bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800/60">
                    🌱 Spring (Day 3/7)
                </span>
            </div>
            <p class="text-[10px] sm:text-[11px] text-stone-400 dark:text-slate-500 mt-0.5" id="graphDataCount">Loading timeline...</p>
        </div>

        <!-- Responsive Range Segment Controls -->
        <div class="flex items-center bg-stone-100 dark:bg-slate-950 p-1 rounded-xl border border-stone-200 dark:border-slate-800 text-[11px] sm:text-xs font-bold w-full sm:w-auto justify-between sm:justify-start">
            <button onclick="changeRange('24h')" id="range-24h" class="flex-1 sm:flex-initial px-3 py-1 rounded-lg transition bg-white dark:bg-slate-800 text-amber-600 dark:text-amber-400 shadow-sm text-center">24H</button>
            <button onclick="changeRange('7d')" id="range-7d" class="flex-1 sm:flex-initial px-3 py-1 rounded-lg transition text-stone-500 dark:text-slate-400 hover:text-stone-900 dark:hover:text-white text-center">7D</button>
            <button onclick="changeRange('30d')" id="range-30d" class="flex-1 sm:flex-initial px-3 py-1 rounded-lg transition text-stone-500 dark:text-slate-400 hover:text-stone-900 dark:hover:text-white text-center">1M</button>
            <button onclick="changeRange('90d')" id="range-90d" class="flex-1 sm:flex-initial px-3 py-1 rounded-lg transition text-stone-500 dark:text-slate-400 hover:text-stone-900 dark:hover:text-white text-center">3M</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div class="bg-white dark:bg-slate-950 border border-stone-200 dark:border-slate-800/80 rounded-xl sm:rounded-2xl p-2.5 sm:p-4 relative h-52 sm:h-64 flex items-center justify-center transition-colors duration-200">
        <div id="chartSpinner" class="hidden absolute inset-0 bg-white/80 dark:bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center z-10 rounded-xl sm:rounded-2xl">
            <i class="fa-solid fa-circle-notch fa-spin text-xl sm:text-2xl text-amber-500 mb-1.5"></i>
            <span class="text-[11px] sm:text-xs text-stone-500 dark:text-slate-400 font-medium">Fetching history...</span>
        </div>
        <canvas id="priceHistoryChart" class="w-full h-full"></canvas>
    </div>
</div>
