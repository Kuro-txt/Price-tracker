<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunflower Land - Resource Price Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center gap-4">
            
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-emerald-600 to-teal-500 p-2.5 rounded-xl text-white shadow-lg shadow-emerald-950">
                    <i class="fa-solid fa-wheat-awn text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight flex items-center gap-2">
                        SFL Price Tracker
                        <span class="inline-flex items-center gap-1.5 text-[10px] bg-emerald-950/80 text-emerald-400 font-mono px-2 py-0.5 rounded-full border border-emerald-800/60">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> LIVE
                        </span>
                    </h1>
                    <p class="text-xs text-slate-400 font-medium" id="lastUpdatedLabel">Connecting to market...</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-2 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs text-slate-400">
                    <input type="checkbox" id="autoRefreshCheck" checked class="accent-emerald-500 cursor-pointer">
                    <label for="autoRefreshCheck" class="cursor-pointer select-none">Auto-Sync (15s)</label>
                </div>
                <button id="refreshBtn" onclick="fetchPrices()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2 border border-slate-700 active:scale-95">
                    <i class="fa-solid fa-rotate" id="refreshIcon"></i> Refresh
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">

        <!-- Spotlight Asset Banner -->
        <div id="spotlightCard" class="bg-gradient-to-r from-slate-900 via-slate-900 to-slate-950 border border-slate-800 rounded-2xl p-6 relative overflow-hidden shadow-xl">
            <div class="absolute right-0 top-0 translate-x-8 -translate-y-8 text-slate-800/20 text-9xl pointer-events-none">
                <i class="fa-solid fa-seedling"></i>
            </div>
            <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                    <span class="text-xs font-mono uppercase tracking-wider text-emerald-400 font-semibold bg-emerald-950/70 border border-emerald-800/40 px-2.5 py-1 rounded-md">
                        Spotlight Asset
                    </span>
                    <h2 class="text-2xl sm:text-3xl font-bold text-white mt-2 flex items-center gap-3" id="spotlightName">
                        Sunflower
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">Calculated floor price & bulk stack estimates</p>
                </div>

                <div class="grid grid-cols-3 gap-3 sm:gap-6 bg-slate-950/60 p-4 rounded-xl border border-slate-800/80">
                    <div>
                        <span class="text-[11px] text-slate-500 uppercase font-semibold block">Unit Floor</span>
                        <span class="text-lg sm:text-xl font-bold font-mono text-emerald-400" id="spotlightUnitPrice">-</span>
                        <span class="text-[10px] text-slate-500">SFL</span>
                    </div>
                    <div>
                        <span class="text-[11px] text-slate-500 uppercase font-semibold block">x100 Stack</span>
                        <span class="text-lg sm:text-xl font-bold font-mono text-slate-200" id="spotlight100Price">-</span>
                        <span class="text-[10px] text-slate-500">SFL</span>
                    </div>
                    <div>
                        <span class="text-[11px] text-slate-500 uppercase font-semibold block">x1,000 Stack</span>
                        <span class="text-lg sm:text-xl font-bold font-mono text-slate-200" id="spotlight1000Price">-</span>
                        <span class="text-[10px] text-slate-500">SFL</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter & Search Controls -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col lg:flex-row gap-4 justify-between items-center shadow-sm">
            
            <!-- Search Input with Dropdown / Autocomplete -->
            <div class="relative w-full lg:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" onfocus="showAutocomplete()" placeholder="Search item (e.g. Sunflower, Wood, Iron)..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500 text-slate-100 placeholder-slate-500 transition">
                
                <!-- Autocomplete Dropdown List -->
                <div id="autocompleteList" class="hidden absolute left-0 right-0 top-full mt-2 bg-slate-900 border border-slate-800 rounded-xl max-h-60 overflow-y-auto z-50 shadow-2xl divide-y divide-slate-800/60">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto justify-end">
                
                <!-- Quick Dropdown Item Selector -->
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <label for="itemDropdown" class="text-xs text-slate-400 uppercase font-semibold whitespace-nowrap">Select Item:</label>
                    <select id="itemDropdown" onchange="onDropdownSelect(this.value)" class="w-full sm:w-48 bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                        <option value="">-- All Items --</option>
                    </select>
                </div>

                <!-- Sort Selector -->
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <label for="sortSelect" class="text-xs text-slate-400 uppercase font-semibold whitespace-nowrap">Sort:</label>
                    <select id="sortSelect" onchange="filterAndSortData()" class="w-full sm:w-44 bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500">
                        <option value="name-asc">Name (A - Z)</option>
                        <option value="name-desc">Name (Z - A)</option>
                        <option value="price-desc">Price (High to Low)</option>
                        <option value="price-asc">Price (Low to High)</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-24">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-500 mb-4"></i>
            <p class="text-slate-400 text-sm font-medium">Extracting live prices from sfl.world...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden bg-rose-950/40 border border-rose-800/80 text-rose-200 p-5 rounded-2xl text-center my-8">
            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 text-rose-400"></i>
            <p id="errorMessage" class="font-medium">Failed to fetch pricing data.</p>
        </div>

        <!-- Prices Grid -->
        <div id="priceGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 hidden">
            <!-- Rendered cards -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950/80 text-center py-6 text-xs text-slate-500">
        <p>Market data synced live from <a href="https://sfl.world" target="_blank" class="text-emerald-400 hover:underline">sfl.world</a></p>
    </footer>

    <script>
        let rawItems = [];
        let autoRefreshTimer = null;
        let selectedSpotlight = "Sunflower";

        async function fetchPrices() {
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const priceGrid = document.getElementById('priceGrid');
            const refreshIcon = document.getElementById('refreshIcon');
            const lastUpdatedLabel = document.getElementById('lastUpdatedLabel');

            if (rawItems.length === 0) {
                loadingState.classList.remove('hidden');
                priceGrid.classList.add('hidden');
            }
            errorState.classList.add('hidden');
            refreshIcon.classList.add('fa-spin');

            const endpoints = [
                '/api/prices',
                'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://sfl.world/api/v1/prices'),
                'https://sfl.world/api/v1/prices'
            ];

            let result = null;
            for (const url of endpoints) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        result = await res.json();
                        break;
                    }
                } catch (e) {}
            }

            refreshIcon.classList.remove('fa-spin');

            if (!result || !result.data) {
                if (rawItems.length === 0) {
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                    document.getElementById('errorMessage').innerText = "Unable to reach SFL API. Ensure your backend proxy is active.";
                }
                return;
            }

            try {
                const timeText = result.updated_text || (result.updatedAt ? new Date(result.updatedAt).toLocaleTimeString() : 'Just now');
                lastUpdatedLabel.innerText = `Last sync: ${timeText}`;

                // Extract P2P items
                const p2pData = result.data.p2p || result.data || {};
                rawItems = Object.entries(p2pData).map(([name, price]) => ({
                    name: name,
                    price: parseFloat(price) || 0
                }));

                populateItemDropdown();
                filterAndSortData();
                updateSpotlight();

                loadingState.classList.add('hidden');
                priceGrid.classList.remove('hidden');
            } catch (err) {
                console.error("Format parsing error:", err);
            }
        }

        function populateItemDropdown() {
            const dropdown = document.getElementById('itemDropdown');
            const previousVal = dropdown.value;
            dropdown.innerHTML = '<option value="">-- All Items --</option>';

            const sorted = [...rawItems].sort((a, b) => a.name.localeCompare(b.name));
            sorted.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = `${item.name} (${formatDisplayPrice(item.price)} SFL)`;
                if (item.name === previousVal) opt.selected = true;
                dropdown.appendChild(opt);
            });
        }

        function handleSearchInput(query) {
            filterAndSortData();
            showAutocomplete(query);
        }

        function showAutocomplete(query = document.getElementById('searchInput').value) {
            const list = document.getElementById('autocompleteList');
            const filtered = rawItems.filter(i => i.name.toLowerCase().includes(query.toLowerCase()));

            if (!query || filtered.length === 0) {
                list.classList.add('hidden');
                return;
            }

            list.innerHTML = '';
            filtered.slice(0, 8).forEach(item => {
                const div = document.createElement('div');
                div.className = "px-4 py-2.5 text-xs text-slate-200 hover:bg-slate-800 cursor-pointer flex justify-between items-center transition";
                div.innerHTML = `
                    <span class="font-medium">${item.name}</span>
                    <span class="font-mono text-emerald-400 font-semibold">${formatDisplayPrice(item.price)} SFL</span>
                `;
                div.onclick = () => {
                    document.getElementById('searchInput').value = item.name;
                    selectSpotlightItem(item.name);
                    list.classList.add('hidden');
                    filterAndSortData();
                };
                list.appendChild(div);
            });

            list.classList.remove('hidden');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#searchInput') && !e.target.closest('#autocompleteList')) {
                document.getElementById('autocompleteList').classList.add('hidden');
            }
        });

        function onDropdownSelect(itemName) {
            document.getElementById('searchInput').value = itemName;
            if (itemName) {
                selectSpotlightItem(itemName);
            }
            filterAndSortData();
        }

        function selectSpotlightItem(name) {
            selectedSpotlight = name;
            updateSpotlight();
        }

        function updateSpotlight() {
            const item = rawItems.find(i => i.name.toLowerCase() === selectedSpotlight.toLowerCase()) || rawItems[0];
            if (!item) return;

            document.getElementById('spotlightName').innerText = item.name;
            document.getElementById('spotlightUnitPrice').innerText = formatDisplayPrice(item.price);
            document.getElementById('spotlight100Price').innerText = formatDisplayPrice(item.price * 100);
            document.getElementById('spotlight1000Price').innerText = formatDisplayPrice(item.price * 1000);
        }

        function filterAndSortData() {
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const sortOption = document.getElementById('sortSelect').value;

            let filtered = rawItems.filter(item => item.name.toLowerCase().includes(searchKeyword));

            filtered.sort((a, b) => {
                const nameA = a.name.toLowerCase();
                const nameB = b.name.toLowerCase();
                if (sortOption === 'name-asc') return nameA.localeCompare(nameB);
                if (sortOption === 'name-desc') return nameB.localeCompare(nameA);
                if (sortOption === 'price-desc') return b.price - a.price;
                if (sortOption === 'price-asc') return a.price - b.price;
                return 0;
            });

            renderGrid(filtered);
        }

        function formatDisplayPrice(price) {
            if (!price || price === 0) return "-";
            if (price < 0.001) return price.toFixed(8).replace(/\.?0+$/, "");
            if (price < 1) return price.toFixed(6).replace(/\.?0+$/, "");
            return price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
        }

        function renderGrid(data) {
            const priceGrid = document.getElementById('priceGrid');
            priceGrid.innerHTML = '';

            if (data.length === 0) {
                priceGrid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-500 bg-slate-900 border border-slate-800 rounded-2xl">
                        <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                        <p class="text-sm">No items found matching your search.</p>
                    </div>
                `;
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-emerald-500/40 transition shadow-sm hover:scale-[1.01] cursor-pointer group";
                card.onclick = () => selectSpotlightItem(item.name);

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <h3 class="font-semibold text-slate-100 text-sm truncate group-hover:text-emerald-400 transition" title="${item.name}">${item.name}</h3>
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-800">
                        <div class="flex items-baseline justify-between">
                            <span class="text-[11px] text-slate-500 uppercase font-semibold">Floor Price</span>
                            <div class="text-right">
                                <span class="text-lg font-bold font-mono ${item.price > 0 ? 'text-emerald-400' : 'text-slate-600'}">
                                    ${formatDisplayPrice(item.price)}
                                </span>
                                <span class="text-[11px] text-slate-400 ml-0.5">SFL</span>
                            </div>
                        </div>
                    </div>
                `;
                priceGrid.appendChild(card);
            });
        }

        function setupAutoRefresh() {
            const check = document.getElementById('autoRefreshCheck');
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);

            if (check.checked) {
                autoRefreshTimer = setInterval(() => {
                    fetchPrices();
                }, 15000);
            }

            check.addEventListener('change', setupAutoRefresh);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPrices();
            setupAutoRefresh();
        });
    </script>
</body>
</html>
